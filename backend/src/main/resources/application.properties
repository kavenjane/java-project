spring.application.name=lostfound
server.port=8080

# ---- MySQL connection (change the password to your own) ----
spring.datasource.url=jdbc:mysql://localhost:3306/lost_found_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=lostfound
spring.datasource.password=lostfound123

# ---- JPA / Hibernate ----
# "update" creates/updates the tables automatically from the Entity classes
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
